name: Verify, build the image, deploy

# The build runs HERE, not on the Coolify server: an Angular production
# build readily exceeds 2 GB of RAM, too much for a small instance. Coolify
# now only pulls the image from GHCR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A push that follows closely cancels the previous one: no point deploying
  # an already-superseded commit.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types (application)
        run: pnpm typecheck

      # SEPARATE pass, and this isn't redundant: tsc doesn't resolve
      # `new Worker(new URL('./souffleurs.worker', import.meta.url))`, so the
      # worker belongs to NO program and is never typed by the application
      # pass. Without this, CI would let a broken worker through.
      - name: Types (inference worker)
        run: pnpm typecheck:worker

      - run: pnpm test

  image:
    name: Image
    needs: verify
    # Never from a PR: we only publish what's on main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `main` is the tag Coolify follows; the short sha tag makes it
          # possible to roll back to a specific commit.
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Coolify deployment
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # As long as the two secrets aren't set, we don't fail the workflow:
      # the image is published and the deployment stays manual.
      # Secrets go through `env`, never through `${{ }}` interpolation in
      # the shell: that pastes the value into the script, which turns it
      # into an injection surface and confuses masking.
      - name: Check configuration
        id: cfg
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -n "$WEBHOOK" ] && [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::COOLIFY_WEBHOOK_URL / COOLIFY_TOKEN missing — image published, deployment must be triggered manually."
          fi

      # NAMED "queue" because that is all it does. The endpoint answers
      # `{"deployments":[{"message":"... deployment queued."}]}` and returns:
      # the outcome lands minutes later and nothing here waits for it.
      #
      # This job reported three green deployments on 02/09 while all three had
      # FAILED in Coolify, and the site stayed four days behind main with no red
      # mark anywhere. A 2xx here means "Coolify accepted the request", never
      # "the new version is serving".
      - name: Queue the deployment
        if: steps.cfg.outputs.ready == 'true'
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          code=$(curl --silent --show-error --output /tmp/out.txt --write-out '%{http_code}' \
            --request GET "$WEBHOOK" \
            --header "Authorization: Bearer $TOKEN")
          echo "HTTP $code"
          cat /tmp/out.txt
          # A webhook that answers 4xx/5xx must FAIL the job: otherwise a
          # deployment that silently didn't trigger passes for a success.
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
          echo "::warning::Deployment QUEUED, not verified — this job cannot tell whether Coolify finished it. Check the deployment in Coolify, or the served site, before calling this shipped."
