server {
  listen 80;
  # EXPLICIT IPv6. nginx's entrypoint script normally adds `listen [::]:80`
  # on its own, but it skips this as soon as the config differs from the
  # packaged one — which it reports in the logs:
  #   "/etc/nginx/conf.d/default.conf differs from the packaged version"
  # And `localhost` resolves to ::1 first: without this line, any local call
  # (the healthcheck first among them) gets "Connection refused", the
  # container goes `unhealthy`, and Coolify refuses to route -> 503 on the
  # Traefik side. Lived on 21/08.
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx sits BEHIND the Coolify proxy, which terminates TLS. Left to its
  # defaults, it builds the "add trailing slash" redirect as an ABSOLUTE URL
  # and guesses the scheme as http:// — downgrading https -> http. Tolerant
  # browsers follow the re-upgrade hop, but strict clients (crawlers, link
  # previews, doc fetchers) refuse the downgrade and report "too many
  # redirects". A RELATIVE Location keeps the original scheme. Setting
  # carried over from apartejs/nginx.docs.conf, where the case is documented.
  absolute_redirect off;
  port_in_redirect off;

  # WebGPU / SharedArrayBuffer (transformers.js) — cross-origin isolation.
  # `credentialless` and not `require-corp`: the app pulls weights from
  # huggingface.co and ORT's wasm runtime from jsdelivr, both cross-origin.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "credentialless" always;

  # NO `types` block here: a `types` block in a child context REPLACES the
  # inherited table instead of extending it. Declaring just wasm at the
  # server level would therefore lose text/css, application/javascript and
  # everything else — the browser then refusing modules over an incorrect
  # MIME type. Modern nginx already maps `application/wasm wasm` in its
  # mime.types, and our ORT wasm comes from the jsdelivr CDN anyway, not
  # from this origin.

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;

  # Assets with a STABLE name: short cache. They look like assets (they're
  # images) but their name carries no fingerprint, so nothing invalidates
  # them. Treating them like the rest — "immutable, one year" — would freeze
  # the social card or the home-screen icon for a year on the very first fix.
  # This block comes BEFORE the extensions one: nginx keeps the first regular
  # expression that matches, in file order.
  location ~* ^/(favicon\.ico|apple-touch-icon\.png|og-card\.png|icons/) {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # ES modules served as-is — pdf.js's worker, vendored under /assets/.
  # `.mjs` is NOT in nginx's MIME table: the file was coming out as
  # `application/octet-stream`, and a browser REFUSES a module of that type
  # ("Expected a JavaScript module script"). And pdf.js instantiates its
  # worker with `new Worker(url, {type:"module"})`: reading PDFs was
  # therefore broken on the deployed site, and ONLY there — the dev server
  # serves .mjs correctly. Measured on 21/08 by a curl on the type.
  #
  # A `types` block REPLACES the inherited table instead of extending it.
  # Here that's harmless, and it's even the only place where it is: this
  # location only serves .mjs, there's no other type to lose.
  location ~* \.mjs$ {
    types { text/javascript mjs; }
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    # Stable name (vendored file, no fingerprint): no "immutable".
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # The manifest, alone: `.webmanifest` is also unknown to nginx and was
  # coming out as `application/octet-stream`. Kept separate, not in the
  # neighboring block that also serves .json and .js: a `types` there would
  # make THEM lose their type, which is exactly the trap described above.
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # robots.txt, sitemap.xml, llms.txt: read by bots that come back
  # periodically, never by the app. A long cache would keep them wrong
  # longer than they're useful.
  location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  # Fingerprinted assets: long cache. (The COOP/COEP headers are re-emitted:
  # add_header in a block replaces the ones from the server level.)
  #
  # `.ttf` comes out here as application/octet-stream — nginx doesn't know
  # it either. Left as is DELIBERATELY: unlike an ES module, a font isn't
  # subject to any type check by the browser, and these .ttf files are only
  # KaTeX's last resort behind woff2 and woff, both served with the correct
  # type. Fixing it would need one more location, in a file where every
  # `types` block is a trap.
  location ~* \.(?:js|mjs|css|wasm|svg|woff2?|ttf|otf|png|jpe?g|webp|avif|gif|ico|map)$ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # =404 and NEVER the SPA fallback: a missing asset must fail with 404.
    # Otherwise `index.html` gets served in its place, and the consumer hits
    # an incomprehensible error — lived in dev on a `.wasm`:
    # "WebAssembly.instantiate(): expected magic word 00 61 73 6d,
    #   found 3c 21 44 4f" (3c 21 44 4f = "<!DO").
    try_files $uri =404;
  }

  # Asset folders: same rule, including for an unknown extension.
  # `icons` is no longer here: its files carry no fingerprint, they're
  # served by the stable-name block above.
  location ~* ^/(assets|media)/ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Service worker + config: never an aggressive cache.
  location ~* ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js)$ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # SPA fallback — reserved for NAVIGATION (/, /chat/:id, /debug/*).
  location / {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
