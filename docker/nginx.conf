server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # WebGPU / SharedArrayBuffer (transformers.js) — iso aimi.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "credentialless" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;

  # Assets fingerprintés : cache long. (Les en-têtes COOP/COEP sont ré-émis :
  # add_header dans un bloc remplace ceux du niveau server.)
  location ~* \.(?:js|css|svg|woff2?|png|webp|avif)$ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Service worker + config : jamais de cache agressif.
  location ~* ^/(ngsw\.json|ngsw-worker\.js|manifest\.webmanifest)$ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
