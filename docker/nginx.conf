server {
  listen 80;
  # IPv6 EXPLICITE. Le script d'entrée de nginx ajoute normalement
  # `listen [::]:80` tout seul, mais il s'en abstient dès que la config diffère
  # de celle du paquet — ce qu'il annonce dans les logs :
  #   « /etc/nginx/conf.d/default.conf differs from the packaged version »
  # Or `localhost` résout d'abord en ::1 : sans cette ligne, tout appel local
  # (healthcheck en tête) se prend « Connection refused », le conteneur passe
  # `unhealthy`, et Coolify refuse de router -> 503 côté Traefik. Vécu le 21/08.
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx est DERRIÈRE le proxy Coolify, qui termine le TLS. Laissé à ses
  # défauts, il construit le redirect « ajoute le slash final » en URL ABSOLUE
  # et devine le schéma en http:// — dégradant https -> http. Les navigateurs
  # tolérants suivent le saut de ré-upgrade, mais les clients stricts (crawlers,
  # aperçus de liens, récupérateurs de doc) refusent la dégradation et signalent
  # « too many redirects ». Un Location RELATIF garde le schéma d'origine.
  # Réglage repris de apartejs/nginx.docs.conf, où le cas est documenté.
  absolute_redirect off;
  port_in_redirect off;

  # WebGPU / SharedArrayBuffer (transformers.js) — iso aimi.
  # `credentialless` et pas `require-corp` : l'app tire les poids depuis
  # huggingface.co et le runtime wasm d'ORT depuis jsdelivr, en cross-origin.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "credentialless" always;

  # PAS de bloc `types` ici : un `types` dans un contexte enfant REMPLACE la
  # table héritée au lieu de l'étendre. Déclarer le seul wasm au niveau server
  # aurait donc fait perdre text/css, application/javascript et tout le reste —
  # le navigateur refusant alors les modules pour MIME incorrect. nginx moderne
  # mappe déjà `application/wasm wasm` dans son mime.types, et de toute façon
  # notre wasm ORT vient du CDN jsdelivr, pas de cette origine.

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;

  # Assets au nom STABLE : cache court. Ils ressemblent à des assets (ce sont
  # des images) mais ils n'ont pas d'empreinte dans leur nom, donc rien ne les
  # invalide. Les traiter comme le reste — « immutable, un an » — reviendrait à
  # figer pour un an la carte sociale ou l'icône de l'écran d'accueil dès la
  # première correction. Ce bloc passe AVANT celui des extensions : nginx retient
  # la première expression régulière qui correspond, dans l'ordre du fichier.
  location ~* ^/(favicon\.ico|apple-touch-icon\.png|og-card\.png|icons/) {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # robots.txt, sitemap.xml, llms.txt : lus par des robots qui repassent, et
  # jamais par l'application. Un cache long les rendrait faux plus longtemps
  # qu'ils ne sont utiles.
  location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  # Assets fingerprintés : cache long. (Les en-têtes COOP/COEP sont ré-émis :
  # add_header dans un bloc remplace ceux du niveau server.)
  location ~* \.(?:js|mjs|css|wasm|svg|woff2?|ttf|otf|png|jpe?g|webp|avif|gif|ico|map)$ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # =404 et JAMAIS le fallback SPA : un asset manquant doit échouer en 404.
    # Sinon on sert `index.html` à sa place, et le consommateur se prend une
    # erreur incompréhensible — vécu en dev sur un `.wasm` :
    # « WebAssembly.instantiate(): expected magic word 00 61 73 6d,
    #   found 3c 21 44 4f » (3c 21 44 4f = « <!DO »).
    try_files $uri =404;
  }

  # Dossiers d'assets : même règle, y compris pour une extension inconnue.
  # `icons` n'y est plus : ses fichiers n'ont pas d'empreinte, ils sont servis
  # par le bloc au nom stable, plus haut.
  location ~* ^/(assets|media)/ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Service worker + config : jamais de cache agressif.
  location ~* ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|manifest\.webmanifest)$ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # SPA fallback — réservé à la NAVIGATION (/, /chat/:id, /debug/*).
  location / {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
