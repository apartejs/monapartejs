<!doctype html>
<!-- `lang` is rewritten by the script below to the chosen locale or the browser's.
     The hard-coded value is what crawlers that do not run JavaScript see; English
     is the site's writing language, so it is the right default, not a fallback. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Monaparté — an AI assistant that runs in your browser</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ── What search engines read ─────────────────────────────────────────
       The description is the one sentence Google shows under the title: it says
       what the site does and what sets it apart. About 155 characters; beyond
       that it is cut mid-sentence. -->
    <meta
      name="description"
      content="A conversational assistant whose model runs entirely in your browser: no server, no data sent anywhere. A demonstration of aparté."
    />
    <!-- `max-image-preview:large` allows the large thumbnail in results. Without
       it, Google limits an unknown site to a small one. -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- Every route serves this same document (SPA fallback). Without a canonical,
       a conversation opened by a crawler — /chat/&lt;id&gt; — would be indexed as
       a distinct page with identical content. -->
    <link rel="canonical" href="https://mon.apartejs.dev/" />

    <!-- ── What social networks and messengers read ─────────────────────────
       These crawlers do NOT run JavaScript: without these tags a shared link
       shows a bare URL. The image must be an ABSOLUTE URL and a bitmap — SVG is
       refused by most platforms, hence public/og-card.png, produced by
       tools/render-assets.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Monaparté" />
    <meta property="og:url" content="https://mon.apartejs.dev/" />
    <meta property="og:title" content="Monaparté — an AI assistant that runs in your browser" />
    <meta
      property="og:description"
      content="The model runs in your browser: no server, no data sent anywhere. A demonstration of aparté."
    />
    <meta property="og:image" content="https://mon.apartejs.dev/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Monaparté — an assistant that runs entirely in your browser"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Monaparté — an AI assistant that runs in your browser" />
    <meta
      name="twitter:description"
      content="The model runs in your browser: no server, no data sent anywhere. A demonstration of aparté."
    />
    <meta name="twitter:image" content="https://mon.apartejs.dev/og-card.png" />

    <!-- ── Icons and system integration ─────────────────────────────────────
       The manifest existed but was linked nowhere, so it did nothing. iOS ignores
       both the manifest AND the SVG for the home screen — it wants
       apple-touch-icon.png, under that exact name. -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="icons/mascotte.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Two `theme-color`s: the browser chrome follows the system theme instead
       of staying light over a dark page. -->
    <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17141c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-title" content="Monaparté" />

    <!-- ── Structured data ──────────────────────────────────────────────────
       Describes the application to search engines in their own vocabulary.
       `price: 0` and `isAccessibleForFree` are true and verifiable: there is no
       account and no payment. Declare nothing here that the page cannot show. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Monaparté",
        "url": "https://mon.apartejs.dev/",
        "description": "A conversational assistant whose model runs entirely in the visitor's browser: no request to an inference server, no data sent anywhere.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Browser with WebAssembly; WebGPU recommended",
        "isAccessibleForFree": true,
        "inLanguage": ["en", "fr"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "image": "https://mon.apartejs.dev/og-card.png"
      }
    </script>

    <script>
      // Theme + locale BEFORE first paint (no FOUC, no "translate this page?" popup).
      (function () {
        try {
          var theme = localStorage.getItem('bp.theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-aparte-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var locale = localStorage.getItem('bp.locale');
          if (!locale) locale = (navigator.language || 'en').slice(0, 2) === 'fr' ? 'fr' : 'en';
          document.documentElement.lang = locale;
        } catch (e) {
          /* storage unavailable: CSS defaults */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>

    <!-- Without JavaScript, `app-root` stays empty: a blank page for the visitor,
       and nothing to index for crawlers that do not render JavaScript — that is,
       almost all of them, Google excepted. This block gives them the page's text,
       and gives whoever disabled JavaScript an explanation rather than an empty
       screen. Styles are inline: the stylesheet is loaded by the very JavaScript
       that is missing. -->
    <noscript>
      <div
        style="
          max-width: 42rem;
          margin: 12vh auto;
          padding: 0 1.5rem;
          font-family: Georgia, 'Times New Roman', serif;
          line-height: 1.6;
          color: #241f2b;
        "
      >
        <p style="font-size: 2rem; color: #b07d33; margin: 0 0 1.5rem">('.')</p>
        <h1 style="font-size: 1.9rem; font-weight: 400; margin: 0 0 1rem">Monaparté</h1>
        <p style="margin: 0 0 1rem">
          A conversational assistant whose language model runs entirely in your browser. No request
          is sent to an inference server: the conversation, the files you attach and the documents
          produced never leave your device.
        </p>
        <p style="margin: 0 0 1rem">
          The application needs JavaScript to work — it is what runs the model. Enable it, then
          reload the page.
        </p>
        <p style="margin: 0; color: #6d6479">
          Monaparté is a demonstration of
          <a href="https://apartejs.dev" style="color: #b07d33">aparté</a>, a chat-interface
          library.
        </p>
      </div>
    </noscript>
  </body>
</html>
