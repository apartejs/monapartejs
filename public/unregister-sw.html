<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>aparté — reset the service worker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Georgia, serif; background: #f6f2ea; color: #241f2b; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { text-align: center; padding: 40px; }
    .face { font-size: 48px; color: #a21caf; }
    button { font: inherit; background: #a21caf; color: #fff; border: none; border-radius: 10px; padding: 10px 22px; cursor: pointer; margin-top: 16px; }
    p { color: #6d6479; }
  </style>
</head>
<body>
  <div class="card">
    <div class="face">(x.x)</div>
    <h1>Reset the service worker</h1>
    <p>Fallback page: unregisters aparté's service worker and clears its app caches.<br>
       The downloaded model (Hugging Face cache) is left untouched.</p>
    <button id="go">Unregister and reload</button>
    <p id="out"></p>
  </div>
  <script>
    document.getElementById('go').addEventListener('click', async () => {
      const out = document.getElementById('out');
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const reg of regs) await reg.unregister();
        const keys = await caches.keys();
        for (const key of keys) {
          if (key.startsWith('ngsw:')) await caches.delete(key);
        }
        out.textContent = 'Done — reloading…';
        setTimeout(() => location.href = '/', 800);
      } catch (e) {
        out.textContent = 'Error: ' + e;
      }
    });
  </script>
</body>
</html>
