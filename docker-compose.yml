# Déploiement Coolify — TIRE une image, ne construit rien.
#
# Pourquoi un compose plutôt qu'un Dockerfile : le build tourne sur les runners
# GitHub (un build Angular en production dépasse volontiers 2 Go de RAM, de trop
# pour une petite instance). Coolify ne doit donc que récupérer l'image publiée.
#
# Et pourquoi CE fichier plutôt qu'un Dockerfile `FROM ghcr.io/...:main` : parce
# que ce montage est structurellement cassé, mesuré le 21/08. Docker ne
# re-télécharge PAS un `FROM` sur un tag mutable s'il l'a en cache (il faut
# `--pull`, que Coolify ne passe pas), et même après un `docker pull` manuel le
# cache de BuildKit réutilise la couche `FROM` déjà résolue puisque le
# Dockerfile n'a pas changé. Résultat : Coolify reconstruisait fidèlement le bon
# commit par-dessus une image vieille de 42 minutes, en boucle.
#
# Un compose sans clé `build:` ne construit rien : Coolify fait un vrai
# `docker compose pull`, donc l'image servie est toujours la dernière publiée.
#
# Coolify :
#   Build Pack             = Docker Compose
#   Docker Compose Location = /docker-compose.yml
#   le domaine reste réglé dans Domains (mon.apartejs.dev), Coolify pose les labels
#   Traefik et le certificat lui-même.
#
# ⚠️ Le paquet GHCR est PRIVÉ par défaut : soit le passer en public, soit
# ajouter les identifiants du registre dans Coolify (Keys & Tokens → Docker
# Registries). Sinon le `pull` échoue en « unauthorized ».
#
# Retour arrière : remplacer `:main` par un tag `:sha-abc1234` publié par la CI.

services:
  web:
    image: ghcr.io/apartejs/monapartejs:main
    restart: unless-stopped
    # Variable MAGIQUE Coolify : c'est elle qui rattache le domaine AU SERVICE
    # et génère les labels Traefik vers le port 80.
    #
    # En Build Pack « Dockerfile », le champ « Domains » de l'application
    # suffisait. En « Docker Compose », Coolify raisonne PAR SERVICE : sans
    # cette déclaration, le router existe mais n'a aucun backend, et Traefik
    # répond 503 avec son certificat par défaut (Let's Encrypt n'émet pas non
    # plus, l'émission attendant un routage fonctionnel). Symptômes vus
    # ensemble le 21/08 alors que le conteneur tournait.
    #
    # Sans valeur : Coolify y injecte le FQDN réglé dans l'interface.
    environment:
      - SERVICE_FQDN_WEB_80

    # nginx écoute 80 dans l'image. Pas de publication de port : Coolify route
    # via Traefik sur le réseau interne.
    expose:
      - '80'
    healthcheck:
      # L'image en déclare déjà un ; on le répète ici pour que Coolify le voie
      # sans avoir à inspecter l'image.
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/index.html']
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    # Aucun volume, aucune variable : le conteneur est sans état. Tout le modèle
    # (base 834 Mo, adapters, tour vision 269 Mo) vit dans le Cache API du
    # navigateur du visiteur, téléchargé depuis Hugging Face.
