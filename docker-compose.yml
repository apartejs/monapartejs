# Coolify deployment — PULLS an image, builds nothing.
#
# Why a compose file rather than a Dockerfile: the build runs on GitHub
# runners (an Angular production build readily exceeds 2 GB of RAM, too much
# for a small instance). Coolify must therefore only fetch the published
# image.
#
# And why THIS file rather than a Dockerfile `FROM ghcr.io/...:main`: because
# that setup is structurally broken, measured on 21/08. Docker does NOT
# re-pull a `FROM` on a mutable tag if it's already cached (that needs
# `--pull`, which Coolify doesn't pass), and even after a manual `docker
# pull` the BuildKit cache reuses the already-resolved `FROM` layer since the
# Dockerfile hasn't changed. Result: Coolify was faithfully rebuilding the
# right commit on top of an image 42 minutes stale, in a loop.
#
# A compose file with no `build:` key builds nothing: Coolify does a real
# `docker compose pull`, so the served image is always the latest published
# one.
#
# Coolify:
#   Build Pack             = Docker Compose
#   Docker Compose Location = /docker-compose.yml
#   the domain stays set in Domains (mon.apartejs.dev), Coolify sets the
#   Traefik labels and the certificate itself.
#
# WARNING: the GHCR package is PRIVATE by default: either make it public, or
# add the registry credentials in Coolify (Keys & Tokens -> Docker
# Registries). Otherwise the `pull` fails with "unauthorized".
#
# Rollback: replace `:main` with a `:sha-abc1234` tag published by CI.

services:
  web:
    image: ghcr.io/apartejs/monapartejs:main
    # WITHOUT THIS LINE, the deployment reports nothing new. Measured on
    # 21/08 on the Coolify log for commit 54f6c1e:
    #
    #   18:22:51  Pulling & building required images.      <- 0.2 s
    #   18:22:52  Removing old containers.
    #   18:22:53  Starting new application.
    #
    # The "Pulling & building" step runs `docker compose build`, which has
    # nothing to do for a service without a `build:` key — hence the 0.2 s.
    # Coolify does NOT run `docker compose pull`. What's left is
    # `docker compose up`, whose default policy is `missing`: the image from
    # the previous deployment is still there, so it reuses it. The container
    # does get recreated, the deployment does show "finished", and the site
    # serves the old code.
    #
    # This is the same class of trap that the `FROM :main` replaced at
    # 14:50: a mutable tag is never re-checked unless you ask for it.
    # `always` asks for it on every `up`.
    pull_policy: always
    restart: unless-stopped
    # Coolify's MAGIC variable: this is what attaches the domain TO THE
    # SERVICE and generates the Traefik labels pointing at port 80.
    #
    # In Build Pack "Dockerfile", the application's "Domains" field was
    # enough. In "Docker Compose", Coolify reasons PER SERVICE: without this
    # declaration, the router exists but has no backend, and Traefik answers
    # 503 with its default certificate (Let's Encrypt doesn't issue one
    # either, issuance waiting on working routing). Symptoms seen together
    # on 21/08 while the container was running.
    #
    # No value: Coolify injects the FQDN set in the UI here.
    environment:
      - SERVICE_FQDN_WEB_80

    # nginx listens on 80 in the image. No port published: Coolify routes
    # via Traefik on the internal network.
    expose:
      - '80'
    healthcheck:
      # The image already declares one; repeated here so Coolify sees it
      # without having to inspect the image.
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/index.html']
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    # No volume, no variable: the container is stateless. The whole model
    # (834 MB base, adapters, 269 MB vision tower) lives in the visitor's
    # browser Cache API, downloaded from Hugging Face.
